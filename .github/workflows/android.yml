name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: SmsForwarder
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -s SmsForwarder/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-maliat-debug
          path: SmsForwarder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
