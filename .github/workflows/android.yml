name: Build and publish SMS Forwarder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: SmsForwarder
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: test -s SmsForwarder/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug
          path: SmsForwarder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Packages (Maven)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-package]')
        working-directory: SmsForwarder
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publishSmsForwarderApkPublicationToGitHubPackagesRepository
