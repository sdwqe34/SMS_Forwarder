name: Build and publish SMS Forwarder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write

env:
  APP_VERSION: 1.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build installable debug APK
        working-directory: SmsForwarder
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK and version
        run: |
          set -euo pipefail
          test -s SmsForwarder/app/build/outputs/apk/debug/app-debug.apk
          test "$(grep -c 'versionName = "1.3.0"' SmsForwarder/app/build.gradle.kts)" -eq 1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug
          path: SmsForwarder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Packages (Maven)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-package]')
        working-directory: SmsForwarder
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publishSmsForwarderApkPublicationToGitHubPackagesRepository

  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: sms-forwarder-debug
          path: release-assets

      - name: Prepare release asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/app-debug.apk
          cp release-assets/app-debug.apk release-assets/SMS-Forwarder-${APP_VERSION}.apk
          cd release-assets
          sha256sum "SMS-Forwarder-${APP_VERSION}.apk" > "SMS-Forwarder-${APP_VERSION}.apk.sha256"

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          target_commitish: ${{ github.sha }}
          name: SMS Forwarder v1.3.0
          body: |
            ## English
            Bilingual Persian/English redesign with a clearer permission flow and local SMS send history.
            - Select sender and destination from SMS inbox, Contacts, or enter a number.
            - Enable auto-forwarding after saving a selected sender and destination.
            - Send a selected existing message once after confirmation.
            - Review source, destination, message content, timestamp, mode, and Android send callback status in History.
            - Permission help explains Android hard-restricted SMS permissions and the limits of “Allow restricted settings”.
            - This is a debug-signed APK for testing. “Sent to network” is not proof of final recipient delivery.
            - Test on real hardware and review permissions before use.

            ## فارسی
            بازطراحی دوزبانه فارسی/انگلیسی همراه با راهنمای روشن‌تر مجوزها و تاریخچه محلی پیامک.
            - انتخاب فرستنده و گیرنده از صندوق پیامک، مخاطبین یا ورود دستی شماره.
            - فعال‌سازی فوروارد خودکار پس از ذخیره قانون فرستنده و گیرنده.
            - ارسال یک‌باره پیام انتخاب‌شده پس از تأیید.
            - نمایش مبدأ، مقصد، متن پیام، زمان، نوع ارسال و وضعیت بازگشتی اندروید در سوابق محلی.
            - توضیحات برنامه محدودیت مجوزهای سخت‌محدودشده و محدودیت گزینه «Allow restricted settings» را شرح می‌دهد.
            - این APK با امضای Debug برای آزمایش ساخته شده است؛ «ارسال‌شده به شبکه» به معنی تأیید تحویل نهایی نیست.
          files: |
            release-assets/SMS-Forwarder-1.3.0.apk
            release-assets/SMS-Forwarder-1.3.0.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
