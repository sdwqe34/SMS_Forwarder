name: Build and publish SMS Forwarder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write

env:
  APP_VERSION: 1.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build installable debug APK
        working-directory: SmsForwarder
        run: gradle --no-daemon clean :app:assembleDebug :sdk:assembleRelease :sdk:testDebugUnitTest

      - name: Verify APK and version
        run: |
          set -euo pipefail
          test -s SmsForwarder/app/build/outputs/apk/debug/app-debug.apk
          test -s SmsForwarder/sdk/build/outputs/aar/sdk-release.aar
          test "$(grep -c 'versionName = "1.4.0"' SmsForwarder/app/build.gradle.kts)" -eq 1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug
          path: SmsForwarder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android SDK AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-android-sdk-aar
          path: SmsForwarder/sdk/build/outputs/aar/sdk-release.aar
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Packages (Maven)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-package]')
        working-directory: SmsForwarder
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publishSmsForwarderApkPublicationToGitHubPackagesRepository

  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: sms-forwarder-debug
          path: release-assets

      - name: Prepare release asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/app-debug.apk
          cp release-assets/app-debug.apk release-assets/SMS-Forwarder-${APP_VERSION}.apk
          cd release-assets
          sha256sum "SMS-Forwarder-${APP_VERSION}.apk" > "SMS-Forwarder-${APP_VERSION}.apk.sha256"

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          target_commitish: ${{ github.sha }}
          name: SMS Forwarder v1.4.0
          body: |
            ## English
            Multi-rule and multi-channel source update.
            - Create independent forwarding rules for different sender IDs/numbers.
            - Optionally require a phrase and/or exclude messages containing a phrase.
            - Select one or more channels per rule: SMS, Email, Telegram, WhatsApp, Bale and Eitaa.
            - Automatic SMS is subject to Android SMS permissions and device restrictions.
            - Email and messenger channels use notification-based, user-confirmed handoffs; they do not silently send in the background.
            - Local history distinguishes SMS callback status from non-SMS handoff status. Neither is proof of final recipient delivery.
            - The APK built by this workflow is debug-signed for testing, not a production-signed Play Store package.

            ## فارسی
            به‌روزرسانی قوانین چندگانه و روش‌های متنوع انتقال.
            - تعریف قوانین مستقل برای شناسه‌ها و شماره‌های فرستنده‌ی متفاوت.
            - شرط اختیاری شامل بودن و/یا مستثنا کردن عبارت از متن پیام.
            - انتخاب یک یا چند روش برای هر قانون: پیامک، ایمیل، تلگرام، واتساپ، بله و ایتا.
            - ارسال خودکار پیامک به مجوزهای اندروید و محدودیت‌های دستگاه وابسته است.
            - ایمیل و پیام‌رسان‌ها از طریق اعلان و واگذاری مورد تأیید کاربر کار می‌کنند و در پس‌زمینه بی‌صدا ارسال ندارند.
            - تاریخچه‌ی محلی وضعیت callback پیامک را از واگذاری کانال‌های دیگر جدا می‌کند؛ هیچ‌یک تأیید قطعی تحویل به گیرنده نیست.
            - APK این گردش‌کار با امضای Debug برای آزمایش ساخته می‌شود، نه به‌عنوان بسته‌ی تولیدی Play Store.
          files: |
            release-assets/SMS-Forwarder-1.4.0.apk
            release-assets/SMS-Forwarder-1.4.0.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
