name: Python rules library

on:
  push:
    branches: [main, master]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/python-publish.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/python-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate package metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tarfile import open as open_tar
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              assert "sms_forwarder/__init__.py" in names
              assert "sms_forwarder/engine.py" in names
          with open_tar(sdists[0]) as tf:
              names = tf.getnames()
              assert any(name.endswith("sms_forwarder/engine.py") for name in names)
          print(f"Built {wheels[0].name} and {sdists[0].name}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-python-dist
          path: python/dist/*
          if-no-files-found: error
          retention-days: 30
