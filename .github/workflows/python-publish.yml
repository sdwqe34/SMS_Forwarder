name: Publish Python package to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        working-directory: python
        run: python -m pip install --upgrade pip build pytest

      - name: Test package
        working-directory: python
        run: python -m pytest -v

      - name: Build distributions
        working-directory: python
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sms-forwarder-rules/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish package to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
