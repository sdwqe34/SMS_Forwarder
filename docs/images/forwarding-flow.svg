<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">SMS Forwarder — Routing workflow</title>
  <desc id="desc">A journal-style three-step infographic: match a sender, apply message conditions, and route to selected channels with clear user confirmation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103d72"/>
      <stop offset="1" stop-color="#176bc0"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46d9be"/>
      <stop offset="1" stop-color="#12a68b"/>
    </linearGradient>
    <filter id="cardshadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173c6a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="30" r="240" fill="#c9e5ff" opacity=".22"/>
  <circle cx="10" cy="660" r="250" fill="#d4f6ec" opacity=".30"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="72" font-size="15" letter-spacing="2" font-weight="800" fill="#168b82">HOW IT WORKS / گردش کار</text>
    <text x="72" y="124" font-size="38" font-weight="800" fill="#0c2b50">One inbox. Rules you control. Destinations you choose.</text>
    <text x="1528" y="170" font-size="25" font-weight="800" fill="#154471" text-anchor="end" direction="rtl" unicode-bidi="plaintext">از صندوق پیامک تا مقصدهای انتخابی، با قوانین تحت کنترل شما</text>
  </g>

  <g filter="url(#cardshadow)">
    <rect x="60" y="205" width="450" height="365" rx="24" fill="#fff" stroke="#dce9f7"/>
    <rect x="575" y="205" width="450" height="365" rx="24" fill="#fff" stroke="#dce9f7"/>
    <rect x="1090" y="205" width="450" height="365" rx="24" fill="#fff" stroke="#dce9f7"/>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <circle cx="106" cy="250" r="24" fill="url(#deep)"/><text x="106" y="258" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">01</text>
    <text x="150" y="256" fill="#123e70" font-size="22" font-weight="800">MATCH THE SENDER</text>
    <text x="472" y="290" fill="#5b7897" font-size="17" text-anchor="end" direction="rtl" unicode-bidi="plaintext">فرستنده را مشخص کنید</text>
    <rect x="94" y="316" width="382" height="94" rx="16" fill="#edf5ff" stroke="#d7e7f8"/>
    <circle cx="131" cy="362" r="20" fill="#2e82da"/>
    <path d="M120 356H142V368H132L125 374V368H120Z" fill="#fff"/>
    <text x="167" y="352" fill="#6785a5" font-size="13" font-weight="700">SOURCE ID</text>
    <text x="167" y="378" fill="#173b65" font-size="20" font-weight="800">Bank / contact / number</text>
    <rect x="94" y="430" width="382" height="88" rx="16" fill="#f8fbff" stroke="#e1ebf6"/>
    <circle cx="124" cy="460" r="6" fill="#22b99a"/><text x="145" y="465" fill="#2b537b" font-size="15">Exact sender or phone match</text>
    <circle cx="124" cy="489" r="6" fill="#22b99a"/><text x="145" y="494" fill="#2b537b" font-size="15">Separate rule for each sender</text>

    <circle cx="621" cy="250" r="24" fill="#7a5ad6"/><text x="621" y="258" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">02</text>
    <text x="665" y="256" fill="#123e70" font-size="22" font-weight="800">FILTER THE MESSAGE</text>
    <text x="987" y="290" fill="#5b7897" font-size="17" text-anchor="end" direction="rtl" unicode-bidi="plaintext">شرط‌های پیام را اعمال کنید</text>
    <rect x="609" y="316" width="382" height="94" rx="16" fill="#f4f0ff" stroke="#e5dcff"/>
    <rect x="632" y="339" width="119" height="29" rx="8" fill="#e4ddff"/><text x="692" y="359" text-anchor="middle" fill="#6347b8" font-size="13" font-weight="800">CONTAINS</text>
    <rect x="761" y="339" width="199" height="29" rx="8" fill="#e4ddff"/><text x="860" y="359" text-anchor="middle" fill="#6347b8" font-size="13" font-weight="800">Verification</text>
    <rect x="632" y="375" width="119" height="22" rx="7" fill="#fff" stroke="#e5dcff"/><text x="692" y="390" text-anchor="middle" fill="#8069c9" font-size="11">OPTIONAL</text>
    <rect x="761" y="375" width="199" height="22" rx="7" fill="#fff" stroke="#e5dcff"/><text x="860" y="390" text-anchor="middle" fill="#8069c9" font-size="11">EXCLUDE PHRASE</text>
    <rect x="609" y="430" width="382" height="88" rx="16" fill="#faf8ff" stroke="#e9e2fb"/>
    <circle cx="639" cy="460" r="6" fill="#7a5ad6"/><text x="660" y="465" fill="#2b537b" font-size="15">Case-insensitive phrase matching</text>
    <circle cx="639" cy="489" r="6" fill="#7a5ad6"/><text x="660" y="494" fill="#2b537b" font-size="15">One rule can use multiple channels</text>

    <circle cx="1136" cy="250" r="24" fill="url(#aqua)"/><text x="1136" y="258" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">03</text>
    <text x="1180" y="256" fill="#123e70" font-size="22" font-weight="800">CHOOSE DESTINATIONS</text>
    <text x="1502" y="290" fill="#5b7897" font-size="17" text-anchor="end" direction="rtl" unicode-bidi="plaintext">یک یا چند مقصد را انتخاب کنید</text>
    <g font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">
      <rect x="1125" y="316" width="178" height="54" rx="13" fill="#e6f8f3" stroke="#d0f0e6"/>
      <circle cx="1152" cy="343" r="13" fill="#25b898"/><path d="M1145 339H1159V347H1152L1148 351V347H1145Z" fill="#fff"/>
      <text x="1175" y="349" fill="#167b69">SMS</text>
      <rect x="1320" y="316" width="178" height="54" rx="13" fill="#fff3db" stroke="#f8e7c0"/>
      <circle cx="1347" cy="343" r="13" fill="#e4a42e"/><path d="M1340 337H1354V349H1340Z M1340 338L1347 343L1354 338" fill="none" stroke="#fff" stroke-width="1.6"/>
      <text x="1370" y="349" fill="#96651a">Email</text>
      <rect x="1125" y="382" width="178" height="54" rx="13" fill="#e8f4ff" stroke="#d6e8fb"/>
      <circle cx="1152" cy="409" r="13" fill="#288bdc"/><path d="M1145 409L1159 402L1156 416L1151 412L1148 415V410Z" fill="#fff"/>
      <text x="1175" y="415" fill="#195d9c">Telegram</text>
      <rect x="1320" y="382" width="178" height="54" rx="13" fill="#edf9ef" stroke="#d9f1dd"/>
      <circle cx="1347" cy="409" r="13" fill="#26a85c"/><path d="M1341 403Q1338 408 1343 414Q1348 418 1353 413L1350 410L1347 412L1343 408L1345 406Z" fill="#fff"/>
      <text x="1370" y="415" fill="#217743">WhatsApp</text>
      <rect x="1125" y="448" width="178" height="54" rx="13" fill="#fff0e5" stroke="#f9dfc9"/>
      <circle cx="1152" cy="475" r="13" fill="#f18b36"/><path d="M1146 469H1158V481H1146Z M1149 472H1155 M1149 476H1155" stroke="#fff" fill="none" stroke-width="1.3"/>
      <text x="1175" y="481" fill="#9e5b20">Bale</text>
      <rect x="1320" y="448" width="178" height="54" rx="13" fill="#fff0e5" stroke="#f9dfc9"/>
      <circle cx="1347" cy="475" r="13" fill="#e87728"/><path d="M1341 469H1353V481H1341Z M1344 472L1350 478 M1350 472L1344 478" stroke="#fff" fill="none" stroke-width="1.3"/>
      <text x="1370" y="481" fill="#9e5b20">Eitaa</text>
    </g>
  </g>

  <path d="M520 387H560" stroke="#84b5e6" stroke-width="4" stroke-linecap="round"/><path d="M550 377L562 387L550 397" fill="none" stroke="#84b5e6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1035 387H1075" stroke="#84b5e6" stroke-width="4" stroke-linecap="round"/><path d="M1065 377L1077 387L1065 397" fill="none" stroke="#84b5e6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(60 600)" font-family="Inter,Arial,sans-serif">
    <rect width="1480" height="62" rx="16" fill="url(#deep)"/>
    <circle cx="33" cy="31" r="15" fill="#36c7aa"/>
    <path d="M26 31L31 36L40 25" stroke="#fff" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="27" fill="#fff" font-size="16" font-weight="800">CLEAR DELIVERY BOUNDARIES</text>
    <text x="62" y="47" fill="#c5e4ff" font-size="13">Automatic SMS needs Android permission. Email and consumer messengers open a prepared handoff for the user to review and send.</text>
    <text x="1448" y="27" fill="#fff" font-size="17" font-weight="800" text-anchor="end" direction="rtl" unicode-bidi="plaintext">مرزبندی شفاف ارسال</text>
    <text x="1448" y="47" fill="#c5e4ff" font-size="14" text-anchor="end" direction="rtl" unicode-bidi="plaintext">انتقال به ایمیل و پیام‌رسان‌ها نیازمند تأیید کاربر است.</text>
  </g>
</svg>