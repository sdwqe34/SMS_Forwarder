<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">SMS Forwarder 1.3.0 — setup, send callbacks, and history</title>
<desc id="desc">A bilingual setup workflow with explicit permissions, sender and recipient selection, send confirmation, status callbacks and local history.</desc>
<rect width="1200" height="340" rx="24" fill="#f6f8fc"/>
<text x="36" y="45" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#131f38">SMS Forwarder 1.3.0 · How it works</text>
<text x="1160" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#0a7a6b">مراحل فوروارد و ثبت سوابق</text>
<g font-family="Arial,sans-serif">
<g transform="translate(28 76)"><rect width="210" height="190" rx="17" fill="#fff" stroke="#e0e5f0"/><circle cx="27" cy="27" r="16" fill="#0a7a6b"/><text x="27" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="52" y="24" font-size="16" font-weight="700" fill="#131f38">Check permissions</text><text x="17" y="66" font-size="13" fill="#5c6b85">SMS + Contacts</text><text x="17" y="95" font-size="13" fill="#0a7a6b">بررسی مجوزها</text><text x="17" y="126" font-size="11" fill="#5c6b85">Restricted SMS access may</text><text x="17" y="142" font-size="11" fill="#5c6b85">require installer allowlisting.</text><text x="17" y="163" font-size="11" fill="#5c6b85">Allow restricted settings is</text><text x="17" y="179" font-size="11" fill="#5c6b85">not a guaranteed fix.</text></g>
<path d="M244 171h22m-7-7 7 7-7 7" stroke="#8a9ab3" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(272 76)"><rect width="210" height="190" rx="17" fill="#fff" stroke="#e0e5f0"/><circle cx="27" cy="27" r="16" fill="#0a7a6b"/><text x="27" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="52" y="24" font-size="16" font-weight="700" fill="#131f38">Choose rule</text><text x="17" y="66" font-size="13" fill="#5c6b85">Sender + destination</text><text x="17" y="95" font-size="13" fill="#0a7a6b">انتخاب فرستنده و گیرنده</text><text x="17" y="126" font-size="11" fill="#5c6b85">Choose from SMS / Contacts</text><text x="17" y="142" font-size="11" fill="#5c6b85">or enter a destination number.</text><text x="17" y="163" font-size="11" fill="#5c6b85">Auto-forwarding is off</text><text x="17" y="179" font-size="11" fill="#5c6b85">until explicitly enabled.</text></g>
<path d="M488 171h22m-7-7 7 7-7 7" stroke="#8a9ab3" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(516 76)"><rect width="210" height="190" rx="17" fill="#fff" stroke="#e0e5f0"/><circle cx="27" cy="27" r="16" fill="#214fb8"/><text x="27" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="52" y="24" font-size="16" font-weight="700" fill="#131f38">Send SMS</text><text x="17" y="66" font-size="13" fill="#5c6b85">Confirm one-time sends</text><text x="17" y="95" font-size="13" fill="#0a7a6b">ارسال با تأیید کاربر</text><text x="17" y="126" font-size="11" fill="#5c6b85">Each attempt creates a local</text><text x="17" y="142" font-size="11" fill="#5c6b85">record before invoking Android</text><text x="17" y="158" font-size="11" fill="#5c6b85">SMS send APIs.</text></g>
<path d="M732 171h22m-7-7 7 7-7 7" stroke="#8a9ab3" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(760 76)"><rect width="210" height="190" rx="17" fill="#fff" stroke="#e0e5f0"/><circle cx="27" cy="27" r="16" fill="#214fb8"/><text x="27" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="52" y="24" font-size="16" font-weight="700" fill="#131f38">Receive callback</text><text x="17" y="66" font-size="13" fill="#5c6b85">Success or failure</text><text x="17" y="95" font-size="13" fill="#0a7a6b">ثبت نتیجه بازگشتی</text><text x="17" y="126" font-size="11" fill="#5c6b85">Multipart sends track each part.</text><text x="17" y="148" font-size="11" fill="#5c6b85">Failure details are retained</text><text x="17" y="164" font-size="11" fill="#5c6b85">in the local log.</text></g>
<path d="M976 171h22m-7-7 7 7-7 7" stroke="#8a9ab3" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(1004 76)"><rect width="168" height="190" rx="17" fill="#e0f5f0" stroke="#a8dfd4"/><circle cx="27" cy="27" r="16" fill="#0a7a6b"/><text x="27" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><text x="52" y="24" font-size="16" font-weight="700" fill="#131f38">History</text><text x="16" y="66" font-size="13" fill="#5c6b85">Source · target</text><text x="16" y="85" font-size="13" fill="#5c6b85">Body · date · status</text><text x="16" y="114" font-size="13" fill="#0a7a6b">سوابق محلی</text><text x="16" y="144" font-size="11" fill="#5c6b85">“Sent to network” is not</text><text x="16" y="160" font-size="11" fill="#5c6b85">proof of recipient delivery.</text></g>
</g>
<text x="36" y="306" font-family="Arial,sans-serif" font-size="13" fill="#5c6b85">Local-only history · Open-source MIT project · No Internet permission</text>
</svg>