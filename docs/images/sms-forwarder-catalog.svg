<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SMS Forwarder app catalog / کاتالوگ فوروارد پیامک</title>
  <desc id="desc">A blue and green Android SMS forwarding app with message selection and recipient selection / برنامه فوروارد پیامک اندروید با انتخاب پیام و گیرنده</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1687ff"/><stop offset="1" stop-color="#0750b5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27c77b"/><stop offset="1" stop-color="#078b57"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18375c" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="0" r="230" fill="#d7eaff" opacity=".65"/>
  <circle cx="25" cy="560" r="180" fill="#d5f8e7" opacity=".75"/>
  <g transform="translate(54 45)">
    <rect width="142" height="142" rx="34" fill="url(#blue)"/>
    <path d="M30 35h80a13 13 0 0 1 13 13v41a13 13 0 0 1-13 13H74l-25 19v-19H30a13 13 0 0 1-13-13V48a13 13 0 0 1 13-13" fill="#fff"/>
    <path d="M40 57h42V45l27 20-27 20V73H40z" fill="#20bb71"/>
    <path d="M102 91H61v12L34 83l27-20v12h41z" fill="#1474e9"/>
  </g>
  <text x="225" y="93" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#102c50">SMS Forwarder</text>
  <text x="226" y="132" font-family="Arial, sans-serif" font-size="22" fill="#406184">Choose a message. Choose a recipient.</text>
  <text x="226" y="166" font-family="Arial, sans-serif" font-size="22" fill="#08744d">فوروارد انتخابی پیامک برای اندروید</text>
  <g transform="translate(56 220)" font-family="Arial, sans-serif">
    <g><circle cx="24" cy="24" r="21" fill="url(#green)"/><path d="M13 24l7 7 15-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="20" font-size="20" font-weight="700" fill="#153557">Select only what you need</text><text x="58" y="45" font-size="16" fill="#526f8c">فقط پیامک موردنظر را انتخاب کنید</text></g>
    <g transform="translate(0 75)"><circle cx="24" cy="24" r="21" fill="#2479ee"/><circle cx="24" cy="18" r="7" fill="#fff"/><path d="M11 34c2-11 24-11 26 0" fill="#fff"/><text x="58" y="20" font-size="20" font-weight="700" fill="#153557">Pick a recipient</text><text x="58" y="45" font-size="16" fill="#526f8c">گیرنده از مخاطبین یا شماره تلفن</text></g>
    <g transform="translate(0 150)"><circle cx="24" cy="24" r="21" fill="#7654e8"/><path d="M14 13h20v22H14zM18 20h12M18 25h12M18 30h8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="58" y="20" font-size="20" font-weight="700" fill="#153557">Automatic or one-time</text><text x="58" y="45" font-size="16" fill="#526f8c">ارسال خودکار یا ارسال یک پیام</text></g>
  </g>
  <g transform="translate(650 40)" filter="url(#shadow)">
    <g transform="translate(0 0)">
