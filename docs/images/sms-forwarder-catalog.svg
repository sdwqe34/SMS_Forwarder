  <rect x="650" y="390" width="490" height="104" rx="18" fill="#fff" stroke="#d8e7f8"/>
  <text x="675" y="421" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#133456">Works with your selection</text>
  <text x="675" y="449" font-family="Arial, sans-serif" font-size="15" fill="#476987">SMS inbox • Contacts • Manual phone number</text>
  <text x="675" y="475" font-family="Arial, sans-serif" font-size="15" fill="#08774d">صندوق پیامک • مخاطبین • شمارهٔ دستی</text>
