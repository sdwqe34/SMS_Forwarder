<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">SMS Forwarder — Selective message routing</title>
  <desc id="desc">Editorial product catalog illustration showing multi-rule message routing, selectable channels and local activity history.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a38"/>
      <stop offset=".58" stop-color="#0b3c75"/>
      <stop offset="1" stop-color="#1462a7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38c8f4"/>
      <stop offset="1" stop-color="#1769ef"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45d5b1"/>
      <stop offset="1" stop-color="#14a88d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03132b" flood-opacity=".20"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b9ddfa" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="840" rx="34" fill="url(#paper)"/>
  <rect width="980" height="840" rx="34" fill="url(#night)"/>
  <path d="M0 670C190 565 340 710 510 620S790 490 980 595V840H0Z" fill="#0a2c57" opacity=".75"/>
  <rect width="980" height="840" rx="34" fill="url(#grid)"/>
  <circle cx="780" cy="128" r="180" fill="#2d9fe9" opacity=".12"/>
  <circle cx="720" cy="730" r="220" fill="#35c9bc" opacity=".08"/>

  <g transform="translate(74 78)">
    <rect width="68" height="68" rx="21" fill="url(#blue)"/>
    <path d="M18 33L50 18L43 50L32 40L25 46L26 35Z" fill="#fff"/>
    <path d="M26 35L50 18L32 40" fill="none" stroke="#dff9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="27" fill="#e9f6ff" font-size="17" font-weight="700" letter-spacing="2" font-family="Inter,Arial,sans-serif">MESSAGE ROUTING</text>
    <text x="88" y="54" fill="#81c9f4" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif">ANDROID UTILITY • v1.4.0</text>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <text x="74" y="250" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1.4">SMS Forwarder</text>
    <text x="78" y="302" fill="#cbe9ff" font-size="25" font-weight="500">Smart rules. Multiple destinations.</text>
    <text x="78" y="364" fill="#ffffff" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">پیام‌ها را طبق قوانین خودکار،</text>
    <text x="78" y="405" fill="#ffffff" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">به یک یا چند مقصد هدایت کنید.</text>
    <text x="78" y="452" fill="#9fc7e9" font-size="17">Choose what matches, where it goes, and how to send.</text>
  </g>

  <g transform="translate(78 500)" font-family="Inter,Arial,sans-serif">
    <rect width="146" height="48" rx="24" fill="#ffffff" fill-opacity=".11" stroke="#8bc8ed" stroke-opacity=".45"/>
    <circle cx="25" cy="24" r="12" fill="url(#mint)"/>
    <path d="M18 20H32V28H25L21 31V28H18Z" fill="#fff"/>
    <text x="48" y="30" fill="#fff" font-size="17" font-weight="700">SMS</text>

    <rect x="158" width="146" height="48" rx="24" fill="#ffffff" fill-opacity=".11" stroke="#8bc8ed" stroke-opacity=".45"/>
    <circle cx="183" cy="24" r="12" fill="#f2b84f"/>
    <path d="M176 19H190V29H176Z M176 20L183 25L190 20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="206" y="30" fill="#fff" font-size="17" font-weight="700">Email</text>

    <rect x="316" width="176" height="48" rx="24" fill="#ffffff" fill-opacity=".11" stroke="#8bc8ed" stroke-opacity=".45"/>
    <circle cx="343" cy="24" r="12" fill="#2395e8"/>
    <path d="M336 24L351 17L347 31L342 27L339 30L339 25Z" fill="#fff"/>
    <text x="365" y="30" fill="#fff" font-size="17" font-weight="700">Telegram</text>

    <rect y="62" width="180" height="48" rx="24" fill="#ffffff" fill-opacity=".11" stroke="#8bc8ed" stroke-opacity=".45"/>
    <circle cx="25" cy="86" r="12" fill="#20b66a"/>
    <path d="M19 80Q16 85 21 90Q26 94 31 89L28 86L25 88L21 84L23 82Z" fill="#fff"/>
    <text x="48" y="92" fill="#fff" font-size="17" font-weight="700">WhatsApp</text>

    <rect x="192" y="62" width="126" height="48" rx="24" fill="#ffffff" fill-opacity=".11" stroke="#8bc8ed" stroke-opacity=".45"/>
    <circle cx="217" cy="86" r="12" fill="#f28d33"/>
    <path d="M211 80H223V92H211Z M214 83H220 M214 87H220" stroke="#fff" fill="none" stroke-width="1.5"/>
    <text x="239" y="92" fill="#fff" font-size="17" font-weight="700">Bale</text>

    <rect x="330" y="62" width="130" height="48" rx="24" fill="#ffffff" fill-opacity=".11" stroke="#8bc8ed" stroke-opacity=".45"/>
    <circle cx="355" cy="86" r="12" fill="#f28d33"/>
    <path d="M349 80H361V92H349Z M352 83L358 89 M358 83L352 89" stroke="#fff" fill="none" stroke-width="1.5"/>
    <text x="377" y="92" fill="#fff" font-size="17" font-weight="700">Eitaa</text>
  </g>

  <g transform="translate(690 128)" filter="url(#shadow)">
    <rect width="260" height="560" rx="39" fill="#091a31" stroke="#9db9d5" stroke-width="2"/>
    <rect x="12" y="13" width="236" height="534" rx="30" fill="#f8fbff"/>
    <rect x="87" y="18" width="86" height="13" rx="7" fill="#071c33"/>
    <circle cx="194" cy="24" r="4" fill="#6b8dab"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="30" y="66" fill="#14345b" font-size="18" font-weight="800">Rule Studio</text>
      <text x="30" y="88" fill="#6b8098" font-size="11">AUTOMATION / 03 RULES</text>
      <rect x="26" y="104" width="208" height="80" rx="14" fill="#eaf4ff" stroke="#d8e8f8"/>
      <text x="40" y="127" fill="#6c829a" font-size="10" font-weight="700">FROM SENDER</text>
      <text x="40" y="151" fill="#173d70" font-size="14" font-weight="700">Bank alerts</text>
      <circle cx="211" cy="145" r="7" fill="#2bc1a0"/>
      <path d="M208 145L210 147L214 142" stroke="#fff" fill="none" stroke-width="1.7"/>
      <rect x="26" y="197" width="208" height="89" rx="14" fill="#fff" stroke="#dbe6f2"/>
      <text x="40" y="220" fill="#6c829a" font-size="10" font-weight="700">MESSAGE CONDITIONS</text>
      <rect x="40" y="233" width="87" height="24" rx="7" fill="#eef7f4"/>
      <text x="51" y="249" fill="#137c67" font-size="10" font-weight="700">Contains</text>
      <rect x="133" y="233" width="87" height="24" rx="7" fill="#edf2ff"/>
      <text x="143" y="249" fill="#2c5fc3" font-size="10" font-weight="700">Verification</text>
      <rect x="26" y="300" width="208" height="154" rx="14" fill="#fff" stroke="#dbe6f2"/>
      <text x="40" y="323" fill="#6c829a" font-size="10" font-weight="700">SEND TO</text>
      <g font-size="12" fill="#163b67" font-weight="700">
        <circle cx="48" cy="347" r="10" fill="#2fbf9c"/><path d="M43 344H53V350H48L45 353V350H43Z" fill="#fff"/>
        <text x="66" y="351">SMS • +98912…</text>
        <circle cx="48" cy="378" r="10" fill="#efb84d"/><path d="M42 375H54V382H42Z M42 375L48 379L54 375" fill="none" stroke="#fff" stroke-width="1.3"/>
        <text x="66" y="382">Email • ops@…</text>
        <circle cx="48" cy="409" r="10" fill="#2795e8"/><path d="M42 409L54 403L51 415L47 411L44 414L44 410Z" fill="#fff"/>
        <text x="66" y="413">Telegram • chosen ID</text>
        <rect x="38" y="429" width="184" height="17" rx="8" fill="#edf6ff"/>
        <text x="130" y="441" fill="#567895" font-size="9" text-anchor="middle">+ WhatsApp · Bale · Eitaa</text>
      </g>
      <rect x="26" y="468" width="208" height="54" rx="13" fill="url(#blue)"/>
      <text x="130" y="490" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">Save rule</text>
      <text x="130" y="506" fill="#e6f5ff" font-size="9" text-anchor="middle">Confirm non-SMS handoffs</text>
    </g>
  </g>

  <g transform="translate(1032 74)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="12" fill="#123c6c" font-size="16" font-weight="800" letter-spacing="1.3">DESIGNED FOR CONTROL</text>
    <text x="0" y="52" fill="#153c69" font-size="29" font-weight="800" text-anchor="start" direction="rtl" unicode-bidi="plaintext">ویژگی‌های کلیدی</text>

    <g transform="translate(0 88)">
      <rect width="486" height="116" rx="20" fill="#fff" stroke="#dbe8f6"/>
      <rect x="20" y="24" width="62" height="62" rx="17" fill="#e9e5ff"/>
      <path d="M37 42L65 68M65 42L37 68M51 34V76" stroke="#7355d7" stroke-width="3.4" stroke-linecap="round"/>
      <text x="454" y="42" fill="#16416e" font-size="20" font-weight="800" text-anchor="end" direction="rtl" unicode-bidi="plaintext">قوانین چندگانه و شرطی</text>
      <text x="454" y="70" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">فرستنده‌های مختلف و فیلتر متن پیام</text>
      <text x="454" y="91" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">برای هر قانون، مقصدهای جداگانه</text>
    </g>

    <g transform="translate(0 220)">
      <rect width="486" height="116" rx="20" fill="#fff" stroke="#dbe8f6"/>
      <rect x="20" y="24" width="62" height="62" rx="17" fill="#dff8ef"/>
      <g fill="none" stroke="#079c83" stroke-width="3">
        <circle cx="39" cy="45" r="7"/><circle cx="64" cy="42" r="7"/><circle cx="52" cy="68" r="7"/>
        <path d="M45 45L57 42M42 51L48 62M61 49L55 62"/>
      </g>
      <text x="454" y="42" fill="#16416e" font-size="20" font-weight="800" text-anchor="end" direction="rtl" unicode-bidi="plaintext">چند روش انتقال</text>
      <text x="454" y="70" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">پیامک، ایمیل، تلگرام، واتساپ،</text>
      <text x="454" y="91" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">بله و ایتا با انتخاب دلخواه کاربر</text>
    </g>

    <g transform="translate(0 352)">
      <rect width="486" height="116" rx="20" fill="#fff" stroke="#dbe8f6"/>
      <rect x="20" y="24" width="62" height="62" rx="17" fill="#e3f0ff"/>
      <circle cx="51" cy="55" r="20" fill="none" stroke="#2478d8" stroke-width="3.5"/>
      <path d="M51 43V56L61 62" fill="none" stroke="#2478d8" stroke-width="3.5" stroke-linecap="round"/>
      <text x="454" y="42" fill="#16416e" font-size="20" font-weight="800" text-anchor="end" direction="rtl" unicode-bidi="plaintext">سوابق و وضعیت روشن</text>
      <text x="454" y="70" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">تاریخچه‌ی محلی پیامک و اعلان‌های</text>
      <text x="454" y="91" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">ارسال نیازمند تأیید کاربر</text>
    </g>

    <g transform="translate(0 484)">
      <rect width="486" height="116" rx="20" fill="#fff" stroke="#dbe8f6"/>
      <rect x="20" y="24" width="62" height="62" rx="17" fill="#fff1d2"/>
      <path d="M51 35L68 42V55C68 68 59 76 51 80C43 76 34 68 34 55V42Z" fill="none" stroke="#d99516" stroke-width="3"/>
      <path d="M43 55L49 61L60 49" fill="none" stroke="#d99516" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="454" y="42" fill="#16416e" font-size="20" font-weight="800" text-anchor="end" direction="rtl" unicode-bidi="plaintext">حریم خصوصی و کنترل</text>
      <text x="454" y="70" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">ذخیره‌ی تنظیمات و تاریخچه به‌صورت</text>
      <text x="454" y="91" fill="#65809b" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">محلی؛ ارسال پیام‌رسان با تأیید کاربر</text>
    </g>

    <rect y="628" width="486" height="92" rx="18" fill="#103b6b"/>
    <text x="24" y="658" fill="#fff" font-size="14" font-weight="800" letter-spacing="1">PERSIAN + ENGLISH</text>
    <text x="24" y="688" fill="#b9e2ff" font-size="16">Bilingual interface • Open source • MIT</text>
    <text x="460" y="658" fill="#fff" font-size="15" font-weight="700" text-anchor="end" direction="rtl" unicode-bidi="plaintext">رابط کاربری فارسی و انگلیسی</text>
    <text x="460" y="688" fill="#b9e2ff" font-size="15" text-anchor="end" direction="rtl" unicode-bidi="plaintext">کد منبع آزاد و قابل بررسی</text>
  </g>
</svg>