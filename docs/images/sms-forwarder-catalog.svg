<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">SMS Forwarder 1.3.0 — bilingual Android interface</title>
<desc id="desc">Preview of the bilingual SMS Forwarder dashboard, send history, Android permission guidance and About screen.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fd"/><stop offset="1" stop-color="#e6f4f0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10203d" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="580" rx="28" fill="url(#bg)"/>
<text x="55" y="76" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#131f38">SMS Forwarder</text>
<text x="56" y="112" font-family="Arial,sans-serif" font-size="20" fill="#5c6b85">Bilingual UI · Local SMS history · Clear permission guidance</text>
<text x="1145" y="112" text-anchor="end" font-family="Arial,sans-serif" font-size="19" fill="#0a7a6b">نسخه ۱.۳.۰ · فارسی و انگلیسی</text>
<g filter="url(#shadow)" font-family="Arial,sans-serif">
<g transform="translate(55 145)"><rect width="245" height="360" rx="26" fill="#17233b"/><rect x="7" y="8" width="231" height="344" rx="20" fill="#f6f8fc"/><rect x="7" y="8" width="231" height="52" rx="20" fill="#fff"/><text x="22" y="40" font-size="16" font-weight="700" fill="#131f38">SMS Forwarder</text><rect x="174" y="19" width="52" height="28" rx="14" fill="#e0f5f0"/><text x="200" y="37" font-size="10" font-weight="700" text-anchor="middle" fill="#0a7a6b">EN فا</text><text x="22" y="89" font-size="20" font-weight="700" fill="#131f38">Forward with confidence</text><rect x="18" y="105" width="209" height="47" rx="12" fill="#fff" stroke="#e0e5f0"/><circle cx="31" cy="126" r="5" fill="#d99a20"/><text x="45" y="123" font-size="12" font-weight="700" fill="#131f38">Permissions need attention</text><text x="45" y="139" font-size="9" fill="#5c6b85">Review access before enabling</text><rect x="18" y="164" width="209" height="169" rx="14" fill="#fff" stroke="#e0e5f0"/><text x="30" y="187" font-size="14" font-weight="700" fill="#131f38">Forwarding rule</text><text x="30" y="207" font-size="9" fill="#5c6b85">SENDER</text><rect x="30" y="214" width="185" height="32" rx="7" fill="#f6f8fc" stroke="#e0e5f0"/><text x="40" y="234" font-size="12" font-weight="700" fill="#131f38">MALIAT</text><text x="30" y="265" font-size="9" fill="#5c6b85">RECIPIENT</text><rect x="30" y="272" width="185" height="32" rx="7" fill="#f6f8fc" stroke="#e0e5f0"/><text x="40" y="292" font-size="12" fill="#131f38">+994 50 ••• •• 67</text><rect x="30" y="311" width="185" height="4" rx="2" fill="#0a7a6b"/></g>
<g transform="translate(340 145)"><rect width="245" height="360" rx="26" fill="#17233b"/><rect x="7" y="8" width="231" height="344" rx="20" fill="#f6f8fc"/><rect x="7" y="8" width="231" height="52" rx="20" fill="#fff"/><text x="22" y="40" font-size="16" font-weight="700" fill="#131f38">Message history</text><rect x="18" y="72" width="209" height="44" rx="12" fill="#fff" stroke="#e0e5f0"/><text x="30" y="91" font-size="12" font-weight="700" fill="#131f38">3 stored records</text><text x="30" y="105" font-size="9" fill="#5c6b85">Stored only on this device</text><rect x="18" y="128" width="209" height="93" rx="12" fill="#fff" stroke="#e0e5f0"/><circle cx="31" cy="145" r="4" fill="#0a7a6b"/><text x="42" y="149" font-size="12" font-weight="700" fill="#131f38">MALIAT</text><text x="30" y="169" font-size="9" fill="#5c6b85">From: MALIAT</text><text x="30" y="184" font-size="9" fill="#5c6b85">To: +994 50 ••• •• 67</text><rect x="30" y="193" width="183" height="17" rx="5" fill="#f6f8fc"/><text x="36" y="205" font-size="8" fill="#5c6b85">Example SMS content appears here</text><rect x="18" y="233" width="209" height="93" rx="12" fill="#fff" stroke="#e0e5f0"/><circle cx="31" cy="250" r="4" fill="#b8383d"/><text x="42" y="254" font-size="12" font-weight="700" fill="#131f38">BANK</text><text x="30" y="274" font-size="9" fill="#5c6b85">Date, time, mode and status</text><text x="30" y="289" font-size="9" fill="#5c6b85">Android callback error detail</text><rect x="30" y="298" width="183" height="17" rx="5" fill="#f6f8fc"/><text x="36" y="310" font-size="8" fill="#5c6b85">Local history; no cloud upload</text></g>
<g transform="translate(625 145)"><rect width="245" height="360" rx="26" fill="#17233b"/><rect x="7" y="8" width="231" height="344" rx="20" fill="#f6f8fc"/><rect x="7" y="8" width="231" height="52" rx="20" fill="#fff"/><text x="22" y="40" font-size="16" font-weight="700" fill="#131f38">Permissions &amp; help</text><rect x="18" y="72" width="209" height="235" rx="14" fill="#fff" stroke="#e0e5f0"/><text x="30" y="94" font-size="13" font-weight="700" fill="#131f38">SMS access on Android</text><text x="30" y="118" font-size="10" fill="#5c6b85">READ_SMS</text><text x="30" y="135" font-size="10" fill="#5c6b85">RECEIVE_SMS</text><text x="30" y="152" font-size="10" fill="#5c6b85">SEND_SMS</text><rect x="30" y="168" width="185" height="1" fill="#e0e5f0"/><text x="30" y="191" font-size="10" fill="#5c6b85">Allow restricted settings may not</text><text x="30" y="206" font-size="10" fill="#5c6b85">override hard-restricted permissions.</text><text x="30" y="230" font-size="10" fill="#5c6b85">The installer may need to allowlist</text><text x="30" y="245" font-size="10" fill="#5c6b85">SMS permissions; the app cannot</text><text x="30" y="260" font-size="10" fill="#5c6b85">grant them to itself.</text><rect x="30" y="275" width="185" height="25" rx="7" fill="#214fb8"/><text x="122" y="292" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Open app settings</text></g>
<g transform="translate(910 145)"><rect width="245" height="360" rx="26" fill="#17233b"/><rect x="7" y="8" width="231" height="344" rx="20" fill="#f6f8fc"/><rect x="7" y="8" width="231" height="52" rx="20" fill="#fff"/><text x="22" y="40" font-size="16" font-weight="700" fill="#131f38">About</text><rect x="18" y="72" width="209" height="235" rx="14" fill="#fff" stroke="#e0e5f0"/><rect x="30" y="86" width="40" height="40" rx="11" fill="#0a7a6b"/><text x="50" y="113" font-size="22" fill="#fff" text-anchor="middle">↗</text><text x="80" y="99" font-size="12" font-weight="700" fill="#131f38">SMS Forwarder</text><text x="80" y="115" font-size="9" fill="#5c6b85">Android open-source utility</text><text x="30" y="151" font-size="12" font-weight="700" fill="#131f38">Project repository</text><text x="30" y="171" font-size="9" fill="#214fb8">github.com/sdwqe34/</text><text x="30" y="185" font-size="9" fill="#214fb8">SMS_Forwarder</text><rect x="30" y="198" width="185" height="27" rx="7" fill="#e8f0fc"/><text x="122" y="215" font-size="10" font-weight="700" fill="#214fb8" text-anchor="middle">Open GitHub repository</text><text x="122" y="251" font-size="13" font-weight="700" fill="#0a7a6b" text-anchor="middle">با تشکر از M.H.K</text><text x="122" y="273" font-size="10" fill="#5c6b85" text-anchor="middle">Version 1.3.0</text></g>
</g>
<text x="58" y="545" font-family="Arial,sans-serif" font-size="13" fill="#5c6b85">UI preview illustration · The app history view contains real locally recorded send attempts, not demo data.</text>
