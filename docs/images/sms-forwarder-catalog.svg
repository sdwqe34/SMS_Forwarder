      <text x="17" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#153557">Recipient</text><rect x="16" y="152" width="112" height="31" rx="7" fill="#fff" stroke="#dbe7f5"/><text x="25" y="171" font-family="Arial, sans-serif" font-size="9" fill="#153557">+994 50 123 4567</text>
      <rect x="16" y="200" width="112" height="22" rx="6" fill="#e5f8ef"/><circle cx="29" cy="211" r="5" fill="#18a766"/><path d="M26 211l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5"/><text x="40" y="214" font-family="Arial, sans-serif" font-size="8" fill="#176646">Auto-forward on</text>
      <rect x="16" y="232" width="112" height="30" rx="8" fill="url(#blue)"/><text x="72" y="251" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Save Settings</text>
      <text x="72" y="288" font-family="Arial, sans-serif" font-size="10" fill="#5f7894" text-anchor="middle">Ready to test</text>
    </g>
