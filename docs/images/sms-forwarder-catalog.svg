      <rect x="16" y="114" width="112" height="37" rx="8" fill="#fff" stroke="#dbe7f5"/><circle cx="31" cy="132" r="8" fill="#d8f6e6"/><text x="45" y="130" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#153557">Bank</text><text x="45" y="142" font-family="Arial, sans-serif" font-size="8" fill="#6d829b">Account message</text>
      <rect x="16" y="159" width="112" height="37" rx="8" fill="#fff" stroke="#dbe7f5"/><circle cx="31" cy="177" r="8" fill="#efe9ff"/><text x="45" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#153557">Friend</text><text x="45" y="187" font-family="Arial, sans-serif" font-size="8" fill="#6d829b">See you soon</text>
      <rect x="16" y="222" width="112" height="34" rx="9" fill="url(#blue)"/><text x="72" y="243" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Choose Message</text>
      <text x="72" y="288" font-family="Arial, sans-serif" font-size="10" fill="#5f7894" text-anchor="middle">Message list</text>
    </g>
    <g transform="translate(170 0)">
      <rect width="145" height="318" rx="22" fill="#16283e"/><rect x="7" y="8" width="131" height="302" rx="16" fill="#f8fbff"/><rect x="7" y="8" width="131" height="47" rx="15" fill="url(#blue)"/><rect x="7" y="39" width="131" height="16" fill="url(#blue)"/>
      <text x="19" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Recipient</text>
      <rect x="16" y="69" width="112" height="38" rx="8" fill="#eaf4ff" stroke="#cde1fa"/><circle cx="31" cy="88" r="9" fill="#2d8aeb"/><text x="31" y="91" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">A</text><text x="47" y="85" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#153557">Ali</text><text x="47" y="97" font-family="Arial, sans-serif" font-size="8" fill="#6d829b">+994 50 123 4567</text>
      <rect x="16" y="114" width="112" height="38" rx="8" fill="#fff" stroke="#dbe7f5"/><circle cx="31" cy="133" r="9" fill="#29b97a"/><text x="31" y="136" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">S</text><text x="47" y="130" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#153557">Sara</text><text x="47" y="142" font-family="Arial, sans-serif" font-size="8" fill="#6d829b">Contact</text>
      <rect x="16" y="222" width="112" height="34" rx="9" fill="url(#green)"/><text x="72" y="243" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Forward Now</text>
      <text x="72" y="288" font-family="Arial, sans-serif" font-size="10" fill="#5f7894" text-anchor="middle">Confirm recipient</text>
    </g>
    <g transform="translate(340 0)">
      <rect width="145" height="318" rx="22" fill="#16283e"/><rect x="7" y="8" width="131" height="302" rx="16" fill="#f8fbff"/><rect x="7" y="8" width="131" height="47" rx="15" fill="url(#blue)"/><rect x="7" y="39" width="131" height="16" fill="url(#blue)"/>
      <text x="18" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Forwarding</text>
